<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Admin Registration</title>
<link rel="stylesheet" href="/css/adminRegister.css">
</head>
<body>

<div class="nav-links">
    <a href="/adminLogin">Login</a>&nbsp;&nbsp;&nbsp;
    <a href="/">Home</a>&nbsp;&nbsp;&nbsp;
   <a href="/logout">Logout</a>

  </div><br><br> 
  

<!-- Main Container -->
<div class="register-container">

 <!-- Top Navigation -->



  
    <!-- Left Side Title -->
    <div class="left-side">
        <h1>Admin Registration</h1>
        <p>Create your admin account to manage your store easily.</p>
    </div>

    <!-- Right Side Form -->
    <div class="form-box">
        <form action="regForm" method="post">

            <label>Name:</label>
            <input type="text" name="name" placeholder="Enter your full name" required><br>

            <label>Email:</label>
            <input type="email" name="email" placeholder="Enter your email" required><br>

            <label>Password:</label>
            <input type="password" name="pass" placeholder="Enter your password" required><br>

            <label>City:</label>
            <input type="text" name="city" placeholder="Enter your city" required><br>

            <input type="submit" value="Register">

        </form>
    </div><br><br>
   
    

</div>

</body>
</html>
